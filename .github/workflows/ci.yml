name: CI

on:
  push:
    branches: [ master, support_8_17_1 ]
  pull_request:
    branches: [ master, support_8_17_1 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload plugin artifact
      uses: actions/upload-artifact@v4
      with:
        name: elasticsearch-analysis-hebrew-plugin
        path: build/distributions/analysis-hebrew-*.zip

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: build/reports/tests/

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build plugin
      run: ./gradlew assemble

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Run integration tests
      run: |
        chmod +x test-integration.sh
        ./test-integration.sh

    - name: Upload integration test logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: integration-test-logs
        path: |
          *.log

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build plugin
      run: ./gradlew assemble

    - name: Extract version from build.gradle
      id: get_version
      run: |
        VERSION=$(grep -E "^    version = '[0-9]" build.gradle | sed "s/.*version = '\(.*\)'/\1/")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Plugin version: $VERSION"

    - name: Copy plugin to demo directory
      run: cp build/distributions/analysis-hebrew-${{ steps.get_version.outputs.version }}.zip demo/elasticsearch-analysis-hebrew.zip

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/whiletrue-industries/elasticsearch-analysis-hebrew
        tags: |
          type=raw,value=${{ steps.get_version.outputs.version }}
          type=sha,format=long
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./demo
        file: ./demo/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          ES_VERSION=8.17.0
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set image visibility to public
      run: |
        # Note: Images are public by default in GitHub Container Registry for public repositories
        echo "Docker image published to:"
        echo "  ghcr.io/whiletrue-industries/elasticsearch-analysis-hebrew:${{ steps.get_version.outputs.version }}"
        echo "  ghcr.io/whiletrue-industries/elasticsearch-analysis-hebrew:sha-${{ github.sha }}"
        echo "  ghcr.io/whiletrue-industries/elasticsearch-analysis-hebrew:latest"
